<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaron’s Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F4; --surface:#FFFFFF; --surface-2:#F5F6F8;
  --ink:#1C2638; --muted:#5E6777; --line:#DCE0E6;
  --ai:#24365C; --ai-ink:#FFFFFF;
  --pink:#A8473A; --butter:#8A6B1C; --mint:#3E6A4A; --sky:#2E5D89; --lilac:#665796;
  --on-accent:#FFFFFF; --danger:#A8473A; --ok:#3E6A4A;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  --jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --card-shadow:0 1px 0 var(--line), 0 12px 32px -18px rgba(20,32,56,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --surface:#161E2E; --surface-2:#1B2436; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2A3448;
    --ai:#9DB4E0; --ai-ink:#0E1420;
    --pink:#D88573; --butter:#D4AE52; --mint:#86B892; --sky:#86AEDC; --lilac:#AE9FDC;
    --on-accent:#0E1420; --danger:#E08C7B; --ok:#86B892;
    --card-shadow:0 1px 0 var(--line), 0 16px 40px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161E2E; --surface-2:#1B2436; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2A3448;
  --ai:#9DB4E0; --ai-ink:#0E1420;
  --pink:#D88573; --butter:#D4AE52; --mint:#86B892; --sky:#86AEDC; --lilac:#AE9FDC;
  --on-accent:#0E1420; --danger:#E08C7B; --ok:#86B892;
  --card-shadow:0 1px 0 var(--line), 0 16px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100vh; font-family:var(--ui); font-weight:400; color:var(--ink); background:var(--bg); line-height:1.7; -webkit-font-smoothing:antialiased}
main{max-width:720px; margin:0 auto; padding:8px 20px 64px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--ai); outline-offset:2px; border-radius:6px}
.jp{font-family:var(--jp); font-weight:600}
.mochi{display:none!important}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); margin-bottom:6px}
.logo{display:flex; align-items:center; gap:10px; background:none; border:0; padding:2px 0; font-weight:700; font-size:16px; letter-spacing:.04em; white-space:nowrap}
.mark{width:30px; height:30px; flex:none; display:grid; place-items:center; background:var(--ai); color:var(--ai-ink); border-radius:6px; font-family:var(--jp); font-weight:700; font-size:17px; letter-spacing:0; line-height:1}
.chips{display:flex; gap:8px; align-items:center; justify-content:flex-end}
.top .chips{flex-wrap:nowrap}
.chip{font-size:13px; color:var(--muted); padding:4px 10px; border-radius:6px; border:1px solid var(--line); white-space:nowrap}
.chip b{font-weight:700; font-size:14px; color:var(--ink); margin:0 3px 0 6px}
.chip .streak{margin-left:8px; color:var(--ink); font-weight:700}
.icon-round{width:34px; height:34px; flex:none; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; padding:0; font-family:var(--jp); font-weight:600; font-size:15px; line-height:1; transition:border-color .15s}
.icon-round:hover{border-color:var(--muted)}
.icon-round svg{width:17px; height:17px}
.lang{background:none; border:1px solid var(--line); border-radius:6px; padding:3px 10px; font-size:13px}

/* buttons */
.btn{font-weight:700; border:1px solid var(--line); border-radius:8px; padding:10px 18px; background:var(--surface); color:var(--ink);
  transition:background .15s, border-color .15s, transform .08s; display:inline-flex; align-items:center; justify-content:center; gap:6px; letter-spacing:.02em}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
.btn.pink{background:var(--ai); border-color:var(--ai); color:var(--ai-ink)}
.btn.mint{background:transparent; border-color:var(--ai); color:var(--ai)}
.btn.big{font-size:16px; padding:13px 28px}
.btn.small{font-size:13px; padding:6px 12px; font-weight:500}
.btn.ghost{background:transparent; border-color:transparent; text-decoration:underline; text-underline-offset:4px; font-weight:500}
.btn.danger{color:var(--danger)}
.btn.danger.fill{background:var(--danger); border-color:var(--danger); color:#fff}
.back{background:none; border:0; font-weight:500; color:var(--muted); padding:6px 0; font-size:14px}

/* hero */
.hero{margin:40px 0 36px}
.bubble{font-family:var(--jp); font-weight:600; font-size:clamp(26px,6.6vw,38px); line-height:1.35; letter-spacing:.01em}
.bubble small{display:block; font-family:var(--ui); font-weight:400; font-size:14px; color:var(--muted); margin-top:12px; max-width:46ch; letter-spacing:0; line-height:1.7}

/* deck grid */
.section-title{font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.06em; margin:0 0 12px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.deck{text-align:left; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:0; overflow:hidden; transition:border-color .15s}
.deck:hover{border-color:var(--muted)}
.deck .tab{height:3px}
.deck .in{padding:14px 16px 16px}
.deck h3{margin:0 0 10px; font-family:var(--jp); font-weight:600; font-size:18px; line-height:1.4; word-break:break-word}
.counts{display:flex; gap:6px; flex-wrap:wrap}
.cnt{--c:var(--muted); font-size:12px; font-weight:700; padding:2px 8px; border-radius:4px; color:var(--c); background:color-mix(in srgb, var(--c) 13%, transparent); white-space:nowrap}
.cnt.new{--c:var(--sky)} .cnt.learn{--c:var(--pink)} .cnt.rev{--c:var(--mint)}
.cnt.zero{--c:var(--muted); background:transparent; font-weight:500; padding-left:0; padding-right:6px}
.deck.add{display:flex; align-items:center; justify-content:center; min-height:104px; border-style:dashed; background:transparent; font-weight:500; color:var(--muted); font-size:14px}

/* deck page */
.deck-head{margin:12px 0 22px}
.deck-head h1{font-family:var(--jp); font-weight:600; font-size:clamp(26px,6.4vw,34px); line-height:1.3; margin:4px 0 2px; word-break:break-word}
.deck-head .dir{font-size:13px; color:var(--muted); margin:0 0 14px}
.big-counts{margin-bottom:20px}
.big-counts .cnt{font-size:13px; padding:3px 10px}
.lessons{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px}
.lchip{border:1px solid var(--line); border-radius:6px; padding:4px 12px; background:var(--surface); font-weight:500; font-size:13px; transition:border-color .15s}
.lchip:hover{border-color:var(--muted)}
.lchip[aria-pressed="true"]{background:var(--ai); border-color:var(--ai); color:var(--ai-ink)}
.lchip.kind{font-size:14px; padding:7px 18px; font-weight:700}
.actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:28px}
.search{width:100%; margin-bottom:6px}
.clist{list-style:none; margin:0; padding:0}
.clist li{display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:12px 2px; border-top:1px solid var(--line); align-items:center}
.clist li:first-child{border-top:0}
.clist .f{font-size:19px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4}
.clist .f small{font-family:var(--ui); font-weight:400; font-size:13px; color:var(--muted); margin-left:8px}
.clist .b{color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.clist .meta{display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap}
.lbadge,.wbadge{font-size:11px; font-weight:700; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.wbadge{color:var(--lilac); border-color:color-mix(in srgb, var(--lilac) 40%, transparent)}
.status{font-size:12px; color:var(--muted); white-space:nowrap}
.icon-btn{background:none; border:0; padding:6px 8px; border-radius:6px; font-size:13px; color:var(--muted)}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}
.empty{color:var(--muted); text-align:center; padding:20px 0; margin:0}

/* study */
.study-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 10px; flex-wrap:wrap}
.study-top .name{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
.stage{position:relative; perspective:1600px; margin-top:34px}
.peek{position:absolute; right:0; top:-30px; z-index:2; pointer-events:none}
.peek .say{display:inline-block; white-space:nowrap; background:var(--ink); color:var(--bg); border-radius:6px; padding:2px 10px; font-weight:700; font-size:12px; animation:pop .2s ease-out}
.card{position:relative; width:100%; min-height:min(56vh,380px); cursor:pointer; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1); text-align:center}
.card.flipped{transform:rotateY(180deg); cursor:default}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--card-shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:44px 24px 56px; overflow:auto}
.face.back{transform:rotateY(180deg)}
.rd{font-size:clamp(14px,3.6vw,17px); color:var(--muted); letter-spacing:.14em; font-family:var(--jp)}
.q{font-size:clamp(30px,8.4vw,54px); line-height:1.35; word-break:break-word}
.q.en{font-family:var(--ui); font-weight:700; font-size:clamp(24px,6vw,34px); letter-spacing:.01em}
.q.kana{font-size:clamp(68px,22vw,120px); line-height:1.1; font-weight:600}
.mini{font-size:clamp(15px,3.8vw,18px); color:var(--muted)}
.mini.en{font-weight:500}
.face.back hr{width:40px; border:0; border-top:1px solid var(--line); margin:16px auto}
.a{font-size:clamp(22px,6vw,34px); line-height:1.4; word-break:break-word}
.a.en{font-weight:700}
.memo{margin-top:12px; font-size:14px; color:var(--muted); background:var(--surface-2); border-radius:6px; padding:4px 12px}
.hint{position:absolute; bottom:16px; left:0; right:0; font-size:12px; color:var(--muted); letter-spacing:.04em}
.tag{position:absolute; top:14px; left:16px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; color:var(--on-accent); letter-spacing:.04em}
.spk{position:absolute; bottom:12px; right:14px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; padding:0; color:var(--ink)}
.spk svg{width:17px; height:17px}
.face .mean{color:var(--muted); margin-top:4px; font-size:14px}
.form-label{display:inline-block; margin-top:16px; color:var(--ai); border:1px solid var(--ai); border-radius:6px; padding:4px 14px; font-weight:700; font-size:clamp(14px,4vw,17px)}
.controls{margin-top:24px; min-height:90px}
.reveal{width:100%}
.rates{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.rate{flex-direction:column; gap:0; padding:9px 4px; border-radius:8px; border:0; color:var(--on-accent); line-height:1.3}
.rate:hover{filter:brightness(1.08)}
.rate .iv{font-size:12px; opacity:.85; font-weight:500}
.rate .lb{font-size:15px; font-weight:700}
.rate.r1{background:var(--pink)} .rate.r2{background:var(--butter)} .rate.r3{background:var(--mint)} .rate.r4{background:var(--sky)}
.rate.rec{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink)}
.keys{text-align:center; font-size:12px; color:var(--muted); margin-top:16px}
.done{text-align:center; padding:56px 0 24px}
.done h2{font-family:var(--jp); font-weight:600; font-size:clamp(24px,6vw,32px); margin:0 0 6px}
.done p{color:var(--muted); margin:0 0 26px}

/* typing + rules */
.ansbox{display:flex; gap:8px; align-items:stretch}
.ansbox input{flex:1; min-width:0; margin:0; font-family:var(--jp); font-size:22px; text-align:center; background:var(--surface)}
.result{display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:center; align-items:baseline; font-weight:700; font-size:16px; margin-bottom:14px; text-align:center}
.result.ok{color:var(--ok)} .result.ng{color:var(--danger)}
.result .jp{color:var(--ink); font-size:21px}
.result s{color:var(--muted); font-weight:500}
.rule{margin:0 auto 16px; max-width:540px; background:var(--surface-2); border-left:3px solid var(--ai); border-radius:6px; padding:10px 14px 12px; font-size:14px; text-align:left}
.rule .g{display:inline-block; color:var(--ai); border:1px solid color-mix(in srgb, var(--ai) 45%, transparent); border-radius:4px; padding:0 7px; font-size:12px; font-weight:700; margin:0 8px 4px 0; vertical-align:middle}
.rule .ch{font-family:var(--jp); font-weight:600; font-size:20px; vertical-align:middle; white-space:nowrap}
.rule p{margin:4px 0 0; color:var(--muted); line-height:1.65}
.face.back .rule{margin:16px auto 0; width:100%}
.clist .why{white-space:normal; font-size:13px; margin-top:2px}
.setup-group{margin-bottom:22px}
.qcard{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:44px 20px 28px; text-align:center}
.bar{height:4px; background:var(--line); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ai)}

/* dialog */
dialog{border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:22px; width:min(520px, calc(100vw - 28px)); max-height:calc(100vh - 40px); box-shadow:0 24px 64px -16px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(14,20,32,.45)}
dialog h2{font-family:var(--jp); font-weight:600; font-size:20px; margin:0 0 14px}
dialog p{margin:0 0 14px}
label{display:block; font-weight:500; font-size:14px; margin-bottom:12px}
input[type=text],input[type=search],input[type=number],textarea,select{display:block; width:100%; margin-top:6px; font:inherit; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px}
input.jp,textarea.jp{font-family:var(--jp); font-size:18px}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--ai); box-shadow:0 0 0 3px color-mix(in srgb, var(--ai) 18%, transparent)}
textarea{resize:vertical; min-height:80px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.check{display:flex; gap:10px; align-items:center}
.check input{width:18px; height:18px; accent-color:var(--ai); margin:0}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row.end{justify-content:flex-end; margin-top:6px}
.swatches{display:flex; gap:10px; margin-top:8px}
.sw{width:28px; height:28px; border-radius:50%; border:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink)}
.note{font-size:13px; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--bg); font-weight:500; font-size:14px; padding:8px 16px; border-radius:8px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:50; white-space:nowrap}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@keyframes pop{from{transform:translateY(4px); opacity:0} to{transform:none; opacity:1}}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

@media (max-width:480px){
  main{padding:4px 16px 56px}
  .logo{font-size:15px; gap:8px}
  .chips{gap:6px}
  .chip{padding:3px 8px}
  .rates{gap:6px}
  .rate .lb{font-size:13px}
  .grid{grid-template-columns:1fr 1fr; gap:10px}
  .deck .in{padding:12px 12px 14px}
  .deck h3{font-size:16px}
  .deck .cnt{font-size:11px}
  .two{grid-template-columns:1fr}
  .study-top{row-gap:4px}
  .study-top .counts{order:3; width:100%}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .actions .btn{width:100%; padding-left:10px; padding-right:10px; font-size:14px; line-height:1.35}
  .actions .btn.big{grid-column:1/-1; font-size:16px}
  .clist li{grid-template-columns:1fr; gap:4px}
  .clist .meta{justify-content:flex-start}
  .hero{margin:28px 0 28px}
}
@media (hover:none) and (pointer:coarse){ .keys{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const MIN = 60000, DAY = 86400000;
const STEPS = [1, 10];
const NEW_PER_DAY = 20;
const LEARN_AHEAD = 20 * MIN;
const KEY = "mochicard-genki-v1";
const COLORS = ["pink","butter","mint","sky","lilac"];

const $ = s => document.querySelector(s);
const app = $("#app"), dlg = $("#dlg");
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const startOfToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const endOfToday = () => startOfToday() + DAY - 1;

/* ---------- strings ---------- */
const STR = {
  en: {
    app: "Aaron’s Card",
    today: n => `Today<b>${n}</b>`,
    streak: n => `<b>${n}</b>day streak`,
    langBtn: "日本語",
    kindV: "Verbs", kindA: "Adjectives",
    conjFlip: "Practice with cards", conjDoneT: "Conjugation done for today", backConj: "Back to conjugation",
    voiceBtn: "Voice", voiceT: "Voice settings", voiceSel: "Voice", voiceAuto: "Auto (best available)",
    voiceRate: "Speed", voiceSrc: "Read from", srcKanji: "Kanji (more natural accent)", srcKana: "Reading (never misreads)",
    voiceTest: "Test", voiceNone: "No Japanese voice was found on this device. Add one in your phone’s settings (see the tip below).",
    voiceTip: "For a more natural voice — iPhone: Settings › Accessibility › Spoken Content › Voices › Japanese, download an “Enhanced” or “Premium” voice. Android: install Google’s Speech Services and download the Japanese voice data.",
    testText: "こんにちは。日本語の勉強、がんばりましょう。",
    heroEmpty: "Make a deck and add the words from your lesson",
    heroEmptySub: "New to Japanese? Start with the hiragana deck",
    heroDone: "All caught up for today",
    heroDoneSub: "See you tomorrow. またあした。",
    heroDue: n => `${n} cards due today`,
    heroDueSub: "Each card comes back just as you’re about to forget it.",
    decks: "Decks", newDeck: "+ New deck",
    cNew: "New", cLearn: "Learning", cRev: "Review",
    toDecks: "‹ Decks",
    jpEn: "Japanese → English", enJp: "English → Japanese",
    study: "Start studying", studyNone: "Done for today",
    addCard: "Add a card", bulk: "Add many", settings: "Deck settings",
    cardsN: n => `${n} cards`,
    search: "Search cards",
    allLessons: "All lessons",
    lesson: n => `Lesson ${n}`,
    notFound: "No matching cards",
    noCards: "No cards yet. Tap “Add a card” to make one",
    sNew: "New", sLearn: "Learning", sToday: "Today", sDays: n => `In ${n}d`,
    edit: "Edit", del: "Delete",
    quit: "‹ Quit",
    tap: "Tap to flip", show: "Show answer",
    rates: ["Again","Hard","Good","Easy"],
    keys: "Keys: Space to flip / 1–4 to answer / P to hear it",
    react: ["Again soon","Almost","Good","Perfect"],
    doneT: "Session complete", doneS: n => `You reviewed ${n} cards this session`,
    backHome: "Back to decks", viewDeck: "View this deck",
    deckNew: "New deck", deckName: "Name", deckNamePh: "e.g. Lesson 3 vocab",

/* ---------- scheduler (SM-2ベース) ---------- */
function schedule(card, r, now = Date.now()){
  const c = { ...card };
  if (c.state === "new" || c.state === "learning"){
    if (c.state === "new"){ c.state = "learning"; c.step = 0; }
    if (r === 1){ c.step = 0; c.due = now + STEPS[0]*MIN; }
    else if (r === 2){ const m = c.step === 0 ? Math.round((STEPS[0]+STEPS[1])/2) : STEPS[c.step]; c.due = now + m*MIN; }
    else if (r === 3){
      c.step++;
      if (c.step >= STEPS.length){ c.state = "review"; c.interval = 1; c.due = startOfToday() + DAY; }
      else c.due = now + STEPS[c.step]*MIN;
    } else { c.state = "review"; c.interval = 4; c.due = startOfToday() + 4*DAY; }
  } else if (c.state === "relearning"){
    if (r === 1) c.due = now + 10*MIN;
    else if (r === 2) c.due = now + 15*MIN;
    else {
      if (r === 4) c.interval = Math.max(c.interval + 1, Math.round(c.interval * 1.5));
      c.state = "review"; c.due = startOfToday() + c.interval*DAY;
    }
  } else {
    if (r === 1){
      c.lapses++; c.ease = Math.max(1.3, c.ease - 0.2);
      c.interval = Math.max(1, Math.round(c.interval * 0.5));
      c.state = "relearning"; c.due = now + 10*MIN;
    } else {
      if (r === 2){ c.ease = Math.max(1.3, c.ease - 0.15); c.interval = Math.max(c.interval + 1, Math.round(c.interval * 1.2)); }
      else if (r === 3){ c.interval = Math.max(c.interval + 1, Math.round(c.interval * c.ease)); }
      else { c.ease += 0.15; c.interval = Math.max(c.interval + 2, Math.round(c.interval * c.ease * 1.3)); }
      c.due = startOfToday() + c.interval*DAY;
    }
  }
  c.reps++;
  return c;
}
function fmtIv(card, r){
  const ja = db.settings.lang === "ja", now = Date.now(), n = schedule(card, r, now);
  if (n.state === "review"){
    const d = n.interval;
    if (d < 30) return ja ? `${d}日` : `${d}d`;
    if (d < 365){ const m = (d/30).toFixed(1).replace(/\.0$/,""); return ja ? `${m}ヶ月` : `${m}mo`; }
    const y = (d/365).toFixed(1).replace(/\.0$/,""); return ja ? `${y}年` : `${y}y`;
  }
  const m = Math.max(1, Math.round((n.due - now)/MIN));
  return m < 60 ? (ja ? `${m}分` : `${m}m`) : (ja ? `${Math.round(m/60)}時間` : `${Math.round(m/60)}h`);
}
function newLeft(deck){
  const k = dayKey();
  return (!deck.newLog || deck.newLog.date !== k) ? NEW_PER_DAY : Math.max(0, NEW_PER_DAY - deck.newLog.n);
}
const inLesson = (c, l) => l == null || c.lesson === l;
function counts(deck, lesson = null){
  const now = Date.now(), eod = endOfToday();
  let learn = 0, rev = 0, nw = 0;
  for (const c of deck.cards){
    if (!inLesson(c, lesson)) continue;
    if (c.state === "new") nw++;
    else if (c.state === "review"){ if (c.due <= eod) rev++; }
    else if (c.due <= now + LEARN_AHEAD) learn++;
  }
  return { learn, rev, nw: Math.min(nw, newLeft(deck)) };
}
function nextCard(deck, lesson, lastId){
  const now = Date.now(), eod = endOfToday();
  const by = (a, b) => a.due - b.due;
  const pool = deck.cards.filter(c => inLesson(c, lesson));
  const learning = pool.filter(c => c.state === "learning" || c.state === "relearning");
  const dueLearn = learning.filter(c => c.due <= now).sort(by);
  if (dueLearn.length) return dueLearn[0];
  const dueRev = pool.filter(c => c.state === "review" && c.due <= eod).sort(by);
  if (dueRev.length) return dueRev[0];
  if (newLeft(deck) > 0){
    const nw = pool.filter(c => c.state === "new").sort((a, b) => a.created - b.created);
    if (nw.length) return nw[0];
  }
  const ahead = learning.filter(c => c.due <= now + LEARN_AHEAD).sort(by);
  return ahead.find(c => c.id !== lastId) || ahead[0] || null;
}
function streak(){
  const log = db.stats.log; let d = new Date(), n = 0;
  if (!log[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (log[dayKey(d)] > 0){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- romaji → kana ---------- */
const ROMA = (() => {
  const t = { a:"あ", i:"い", u:"う", e:"え", o:"お" };
  const rows = { k:"かきくけこ", g:"がぎぐげご", s:"さしすせそ", z:"ざじずぜぞ", t:"たちつてと", d:"だぢづでど", n:"なにぬねの",
    h:"はひふへほ", b:"ばびぶべぼ", p:"ぱぴぷぺぽ", m:"まみむめも", r:"らりるれろ", c:"かしくせこ" };
  for (const [c, ks] of Object.entries(rows)) [..."aiueo"].forEach((v, i) => t[c + v] = ks[i]);
  Object.assign(t, { ya:"や", yu:"ゆ", yo:"よ", ye:"いぇ", wa:"わ", wi:"うぃ", we:"うぇ", wo:"を",
    shi:"し", chi:"ち", tsu:"つ", fu:"ふ", ji:"じ",
    fa:"ふぁ", fi:"ふぃ", fe:"ふぇ", fo:"ふぉ", ja:"じゃ", ju:"じゅ", jo:"じょ", je:"じぇ",
    sha:"しゃ", shu:"しゅ", sho:"しょ", she:"しぇ", cha:"ちゃ", chu:"ちゅ", cho:"ちょ", che:"ちぇ",
    thi:"てぃ", dhi:"でぃ", vu:"ゔ", va:"ゔぁ", vi:"ゔぃ", ve:"ゔぇ", vo:"ゔぉ",
    xa:"ぁ", xi:"ぃ", xu:"ぅ", xe:"ぇ", xo:"ぉ", la:"ぁ", li:"ぃ", lu:"ぅ", le:"ぇ", lo:"ぉ",
    xya:"ゃ", xyu:"ゅ", xyo:"ょ", lya:"ゃ", lyu:"ゅ", lyo:"ょ", xtu:"っ", ltu:"っ", xtsu:"っ", ltsu:"っ", "-":"ー" });
  const yo = { k:"き", g:"ぎ", s:"し", z:"じ", j:"じ", t:"ち", c:"ち", d:"ぢ", n:"に", h:"ひ", b:"び", p:"ぴ", m:"み", r:"り" };
  for (const [c, k] of Object.entries(yo)){ t[c + "ya"] = k + "ゃ"; t[c + "yu"] = k + "ゅ"; t[c + "yo"] = k + "ょ"; }
  return t;
})();
const ROMA_KEYS = Object.keys(ROMA);
function toKana(str, final = false){
  const s = String(str).toLowerCase(); let out = "", i = 0;
  while (i < s.length){
    const c = s[i];
    if (!/[a-z'\-]/.test(c)){ out += c; i++; continue; }
    if (c === "n"){
      const nx = s[i+1];
      if (nx === undefined){ out += final ? "ん" : "n"; i++; continue; }
      if (nx === "'"){ out += "ん"; i += 2; continue; }
      if (nx === "n"){
        const n2 = s[i+2];
        if (n2 === undefined){ out += final ? "ん" : "nn"; i += 2; continue; }
        if (/[aiueoy]/.test(n2)){ out += "ん"; i++; continue; }
        out += "ん"; i += 2; continue;
      }
      if (!/[aiueoy]/.test(nx)){ out += "ん"; i++; continue; }
    }
    if (c === s[i+1] && /[bcdfghjkmpqrstvwxz]/.test(c)){ out += "っ"; i++; continue; }
    let hit = false;
    for (let L = 4; L >= 1; L--){
      const ch = s.substr(i, L);
      if (ch.length === L && ROMA[ch]){ out += ROMA[ch]; i += L; hit = true; break; }
    }
    if (hit) continue;
    const rest = s.slice(i);
    if (!final && ROMA_KEYS.some(k => k.startsWith(rest))){ out += rest; break; }
    out += c; i++;
  }
  return out;
}
const kataToHira = s => s.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
const norm = s => kataToHira(toKana(String(s).normalize("NFKC"), true)).replace(/[\s、。・,.!！?？〜~「」]/g, "");
const splitAlts = s => String(s || "").split(/[\/／;；]/).map(x => x.trim()).filter(Boolean);
function answersOf(card){
  const alts = [];
  for (const a of [...splitAlts(card.reading), ...splitAlts(card.jp)]){
    alts.push(a);
    if (/[()（）]/.test(a)){ alts.push(a.replace(/[()（）]/g, "")); alts.push(a.replace(/[（(][^）)]*[）)]/g, "")); }
  }
  return new Set(alts.map(norm).filter(Boolean));
}

/* ---------- conjugation ---------- */
const VF = ["masu","masen","mashita","masendeshita","te","nai","ta","nakatta","tai","vol","pot","ba","pass","caus"];
const AF = ["a_neg","a_past","a_pastneg","a_te"];
const isVerb = c => ["ru","u","irr"].includes(c.wtype);
const isAdj = c => ["i","na"].includes(c.wtype);
const GODAN = { "う":"わいうえお", "く":"かきくけこ", "ぐ":"がぎぐげご", "す":"さしすせそ", "つ":"たちつてと", "ぬ":"なにぬねの", "ぶ":"ばびぶべぼ", "む":"まみむめも", "る":"らりるれろ" };
const TE = { "う":"って", "つ":"って", "る":"って", "む":"んで", "ぶ":"んで", "ぬ":"んで", "く":"いて", "ぐ":"いで", "す":"して" };
function verbTable(r, jp, type){
  let pre, f;
  if (type === "irr"){
    if (r.endsWith("する")){ pre = r.slice(0, -2);
      f = { masu:"します", nai:"しない", ta:"した", te:"して", tai:"したい", vol:"しよう", pot:"できる", ba:"すれば", pass:"される", caus:"させる" };
    } else if (r.endsWith("くる")){ pre = r.slice(0, -2);
      f = { masu:"きます", nai:"こない", ta:"きた", te:"きて", tai:"きたい", vol:"こよう", pot:["こられる","これる"], ba:"くれば", pass:"こられる", caus:"こさせる" };
    } else return null;
  } else if (type === "ru"){
    if (!r.endsWith("る")) return null;
    pre = r.slice(0, -1);
    f = { masu:"ます", nai:"ない", ta:"た", te:"て", tai:"たい", vol:"よう", pot:["られる","れる"], ba:"れば", pass:"られる", caus:"させる" };
  } else {
    const e = r.slice(-1), row = GODAN[e]; if (!row) return null;
    pre = r.slice(0, -1);
    const a = e === "う" ? "わ" : row[0], i = row[1], ee = row[3], o = row[4];
    const te = (r === "いく" || /行く$/.test(jp)) ? "って" : TE[e];
    f = { masu:i+"ます", nai:a+"ない", ta:te.replace(/て$/,"た").replace(/で$/,"だ"), te, tai:i+"たい", vol:o+"う", pot:ee+"る", ba:ee+"ば", pass:a+"れる", caus:a+"せる" };
  }
  const out = {};
  for (const [k, v] of Object.entries(f)) out[k] = [].concat(v).map(x => pre + x);
  out.masen = out.masu.map(x => x.replace(/ます$/, "ません"));
  out.mashita = out.masu.map(x => x.replace(/ます$/, "ました"));
  out.masendeshita = out.masu.map(x => x.replace(/ます$/, "ませんでした"));
  out.nakatta = out.nai.map(x => x.replace(/ない$/, "なかった"));
  if (type === "u" && r === "ある"){ out.nai = ["ない"]; out.nakatta = ["なかった"]; }
  return out;
}
function adjTable(r, type){
  if (type === "i"){
    if (!r.endsWith("い")) return null;
    const st = r.endsWith("いい") ? r.slice(0, -2) + "よ" : r.slice(0, -1);
    return { a_neg:[st+"くない"], a_past:[st+"かった"], a_pastneg:[st+"くなかった"], a_te:[st+"くて"] };
  }
  return { a_neg:[r+"じゃない", r+"ではない"], a_past:[r+"だった"], a_pastneg:[r+"じゃなかった", r+"ではなかった"], a_te:[r+"で"] };
}
function toJp(jp, r, full, type){
  if (jp === r) return full;
  if (type === "irr" && /くる$/.test(r) && /来る$/.test(jp)) return jp.slice(0, -1) + full.slice(r.length - 1);
  let k = 0;
  while (k < jp.length && k < r.length && jp[jp.length-1-k] === r[r.length-1-k]) k++;
  const rStem = r.slice(0, r.length - k), jStem = jp.slice(0, jp.length - k);
  return full.startsWith(rStem) ? jStem + full.slice(rStem.length) : full;
}
const baseOf = c => { const j = splitAlts(c.jp)[0] || c.jp; return c.wtype === "na" ? j.replace(/な$/, "") : j; };
function conjugate(card, form){
  let r = splitAlts(card.reading)[0] || splitAlts(card.jp)[0] || "", jp = baseOf(card);
  if (card.wtype === "na") r = r.replace(/な$/, "");
  r = kataToHira(r);
  const tbl = isVerb(card) ? verbTable(r, jp, card.wtype) : isAdj(card) ? adjTable(r, card.wtype) : null;
  const full = tbl && tbl[form]; if (!full || !full.length) return null;
  const jps = full.map(f => toJp(jp, r, f, card.wtype));
  return { reading: full[0], jp: jps[0], answers: new Set([...full, ...jps].map(norm)) };
}
const RU_AS_U = ["帰る","入る","知る","切る","走る","要る","減る","限る","喋る","滑る","蹴る","握る","参る","散る","焦る","茂る"];
const ONE_KANJI_RU = ["見る","寝る","着る","出る","居る","似る","煮る","得る","経る"];
function guessType(r, jp){
  const k = /[\u4e00-\u9faf]/;
  if (/する$/.test(r) || (r === "くる" || /来る$/.test(jp))) return "irr";
  if (!k.test(jp)) return "";
  if (RU_AS_U.some(w => jp.endsWith(w))) return "u";
  if (ONE_KANJI_RU.some(w => jp.endsWith(w)) && jp.length <= 3) return "ru";
  if (/る$/.test(jp)){
    const prev = jp.slice(-2, -1);
    if (/[いきしちにひみりぎじびぴえけせてねへめれげぜべぺ]/.test(prev)) return "ru";
    return "u";
  }
  if (/[\u4e00-\u9faf][うくぐすつぬぶむ]$/.test(jp)) return "u";
  if (/[\u4e00-\u9faf][ぁ-ん]*い$/.test(jp)) return "i";
  return "";
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const canSpeak = "speechSynthesis" in window;
function voiceSettings(){
  if (!db.settings.voice) db.settings.voice = { name: "", rate: 1, src: "kanji" };
  return db.settings.voice;
}
function jaVoices(){
  try { return speechSynthesis.getVoices().filter(v => v.lang && v.lang.replace("_","-").toLowerCase().startsWith("ja")); } catch (e) { return []; }
}
function voiceScore(v){
  const n = v.name.toLowerCase(); let s = 0;
  if (/enhanced|premium|natural|neural|online|拡張|高品質|プレミアム/.test(n)) s += 4;
  if (/google/.test(n)) s += 3;
  if (/nanami|keita|kyoko|otoya|o-ren|hattori|sakura/.test(n)) s += 1;
  if (/compact|eloquence|grandma|grandpa|shelley|rocko|flo|reed|sandy/.test(n)) s -= 3;
  return s;
}
function pickVoice(){
  const list = jaVoices(), want = voiceSettings().name;
  return list.find(v => v.name === want) || list.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
}
function speakPair(jp, reading){
  const src = voiceSettings().src, k = /[\u4e00-\u9faf]/;
  const j = splitAlts(jp)[0] || "", r = splitAlts(reading)[0] || "";
  speakText(src === "kanji" && k.test(j) ? j : (r || j));
}
function speak(card){ if (card) speakPair(card.jp, card.reading); }
function speakText(text){
  if (!canSpeak || !text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = voiceSettings().rate; u.pitch = 1;
    const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
if (canSpeak) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (dlg.open && $("#f-voice")) voiceDialog(); }; } catch (e) {}

function ruleInfo(card, form, res){

    <label>${s.fMean}<input type="text" id="f-mean" placeholder="${s.fMeanPh}" value="${card ? esc(card.meaning) : ""}"></label>
    <div class="two">
      <label>${s.fLesson}<input type="number" id="f-lesson" min="1" max="99" inputmode="numeric" value="${lastLesson ?? ""}"></label>
      <label>${s.fNote}<input type="text" id="f-note" placeholder="${s.fNotePh}" value="${card ? esc(card.note) : ""}"></label>
    </div>
    <label>${s.fWtype}<select id="f-wt">${Object.entries(s.wtypes).map(([k, l]) => `<option value="${k}" ${(card ? card.wtype || "" : "") === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <div class="row end">
      <span class="note" style="margin-right:auto">${card ? "" : s.addHint}</span>
      <button class="btn ghost" data-action="close">${card ? s.cancel : s.close}</button>
      <button class="btn pink" id="f-ok">${card ? s.save : s.add}</button>
    </div>`, el => {
    const g = id => el.querySelector(id);
    let touched = !!(card && card.wtype);
    g("#f-wt").addEventListener("change", () => touched = true);
    const guess = () => { if (!touched) g("#f-wt").value = guessType(kataToHira(g("#f-rd").value.trim() || g("#f-jp").value.trim()), g("#f-jp").value.trim()); };
    g("#f-rd").addEventListener("input", guess); g("#f-jp").addEventListener("input", guess);
    const ok = () => {
      const jp = g("#f-jp").value.trim(), mean = g("#f-mean").value.trim();
      if (!jp || !mean){ (jp ? g("#f-mean") : g("#f-jp")).focus(); toast(s.bothReq); return; }
      const ln = parseInt(g("#f-lesson").value, 10);
      const vals = { jp, reading: g("#f-rd").value.trim(), meaning: mean, lesson: Number.isFinite(ln) ? ln : null, note: g("#f-note").value.trim(), wtype: g("#f-wt").value };
      if (card){ Object.assign(card, vals); save(); closeDialog(); render(); toast(s.saved); }
      else {
        deck.cards.push(newCard(vals.jp, vals.reading, vals.meaning, vals.lesson, vals.note, vals.wtype)); save(); render();
        ["#f-jp","#f-rd","#f-mean","#f-note","#f-wt"].forEach(id => g(id).value = ""); touched = false; g("#f-jp").focus();
        toast(s.added(deck.cards.length));
      }
    };
    g("#f-ok").addEventListener("click", ok);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing && (e.ctrlKey || e.metaKey)){ e.preventDefault(); ok(); }
    });
  });
}
const WT_MAP = { ru:"ru", "る":"ru", "ru-verb":"ru", "る動詞":"ru", ichidan:"ru", u:"u", "う":"u", "u-verb":"u", "う動詞":"u", godan:"u",
  irr:"irr", irregular:"irr", "する":"irr", "不規則":"irr", "不規則動詞":"irr", i:"i", "い":"i", "i-adj":"i", "い形容詞":"i", na:"na", "な":"na", "na-adj":"na", "な形容詞":"na" };
function parseLine(line){
  const sep = line.includes("\t") ? "\t" : ",";
  const p = line.split(sep).map(x => x.trim());
  const trim = () => { while (p.length && !p[p.length - 1]) p.pop(); };
  trim();
  if (p.length < 2 || !p[0]) return null;
  let lesson = null, wt = "";
  if (p.length >= 3 && WT_MAP[p[p.length - 1].toLowerCase()] !== undefined){ wt = WT_MAP[p.pop().toLowerCase()]; trim(); }
  if (p.length >= 3 && /^\d{1,2}$/.test(p[p.length - 1])){ lesson = parseInt(p.pop(), 10); trim(); }
  if (p.length < 2) return null;
  if (p.length === 2) return [p[0], "", p[1], lesson, wt];
  return [p[0], p[1], p.slice(2).join(", "), lesson, wt];
}
function importDialog(deck){
  const s = T();
  openDialog(`<h2>${s.bulk}</h2>
    <p class="note">${s.bulkHelp}</p>
    <label class="sr" for="f-bulk">${s.bulk}</label>
    <textarea id="f-bulk" class="jp" rows="8" placeholder="${esc(s.bulkPh)}" autofocus></textarea>
    <div class="row end">
      <span class="note" id="f-count" style="margin-right:auto">${s.nCards(0)}</span>
      <button class="btn ghost" data-action="close">${s.cancel}</button>
      <button class="btn pink" id="f-ok">${s.add}</button>
    </div>`, el => {
    const ta = el.querySelector("#f-bulk");
    const parse = () => ta.value.split(/\r?\n/).map(parseLine).filter(Boolean);
    ta.addEventListener("input", () => { el.querySelector("#f-count").textContent = s.nCards(parse().length); });
    el.querySelector("#f-ok").addEventListener("click", () => {
      const rows = parse();
      if (!rows.length){ toast(s.noRows); return; }
      const t = Date.now();
      rows.forEach(([jp, rd, m, l, w], i) => deck.cards.push(Object.assign(newCard(jp, rd, m, l, "", w), { created: t + i })));
      save(); closeDialog(); render(); toast(s.bulkAdded(rows.length));
    });
  });
}
function voiceDialog(){
  const s = T(), vs = voiceSettings(), list = jaVoices().sort((a, b) => voiceScore(b) - voiceScore(a));
  openDialog(`<h2>${s.voiceT}</h2>
    ${list.length ? `<label>${s.voiceSel}<select id="f-voice">
      <option value="">${s.voiceAuto}</option>
      ${list.map(v => `<option value="${esc(v.name)}" ${v.name === vs.name ? "selected" : ""}>${esc(v.name)}</option>`).join("")}
    </select></label>` : `<p class="note" id="f-voice">${s.voiceNone}</p>`}
    <label>${s.voiceRate} <span id="f-rate-v">${vs.rate.toFixed(2)}×</span><input type="range" id="f-rate" min="0.6" max="1.3" step="0.05" value="${vs.rate}" style="width:100%;accent-color:var(--pink)"></label>
    <label>${s.voiceSrc}<select id="f-src">
      <option value="kanji" ${vs.src === "kanji" ? "selected" : ""}>${s.srcKanji}</option>
      <option value="kana" ${vs.src === "kana" ? "selected" : ""}>${s.srcKana}</option>
    </select></label>
    <p class="note">${s.voiceTip}</p>
    <div class="row end">
      <button class="btn" id="f-test" style="margin-right:auto">${s.voiceTest}</button>
      <button class="btn pink" data-action="close">${s.close}</button>
    </div>`, el => {
    const sel = el.querySelector("select#f-voice"), rate = el.querySelector("#f-rate"), src = el.querySelector("#f-src");
    sel && sel.addEventListener("change", () => { vs.name = sel.value; save(); speakText(s.testText); });
    rate.addEventListener("input", () => { vs.rate = Number(rate.value); el.querySelector("#f-rate-v").textContent = vs.rate.toFixed(2) + "×"; save(); });
    src.addEventListener("change", () => { vs.src = src.value; save(); });
    el.querySelector("#f-test").addEventListener("click", () => speakText(s.testText));
  });
}
function confirmDialog(msg, label, fn){
  const s = T();
  openDialog(`<h2>${label}</h2><p>${msg}</p>
    <div class="row end"><button class="btn ghost" data-action="close" autofocus>${s.cancel}</button><button class="btn danger fill" id="f-ok">${label}</button></div>`,
    el => el.querySelector("#f-ok").addEventListener("click", () => { closeDialog(); fn(); }));
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id, d = getDeck(view.id), s = T();
  switch (a){
    case "home": go({ name: "home" }); break;
    case "lang": db.settings.lang = db.settings.lang === "en" ? "ja" : "en"; save(); render(); break;
    case "voice": voiceDialog(); break;
    case "open-deck": go({ name: "deck", id, lesson: view.id === id ? view.lesson : null }); break;
    case "lesson": view.lesson = el.dataset.l === "" ? null : Number(el.dataset.l); renderDeck(); break;
    case "new-deck": deckDialog(null); break;
    case "edit-deck": d && deckDialog(d); break;
    case "add-card": d && cardDialog(d, null); break;
    case "import": d && importDialog(d); break;
    case "edit-card": d && cardDialog(d, d.cards.find(c => c.id === id)); break;
    case "del-card": if (d){ const c = d.cards.find(x => x.id === id);
      confirmDialog(s.delCardMsg(esc(c.jp)), s.delCard, () => { d.cards = d.cards.filter(x => x.id !== id); save(); render(); toast(s.deleted); }); } break;
    case "study": if (d) go({ name: "study", id: d.id, mode: el.dataset.mode || "flip", typed: null, lesson: view.lesson ?? null, card: nextCard(d, view.lesson ?? null), flipped: false, done: 0 }); break;
    case "check": checkTyped(); break;
    case "conj-setup": if (d) go({ name: "conj-setup", id: d.id, lesson: view.lesson ?? null, kind: view.kind }); break;
    case "ckind": view.kind = el.dataset.k; renderConjSetup(); break;
    case "cform": { const arr = conjSettings()[el.dataset.k], f = el.dataset.f, i = arr.indexOf(f);
      if (i >= 0) arr.splice(i, 1); else arr.push(f); save(); renderConjSetup(); break; }
    case "conj-start": startConj(el.dataset.mode || "flip"); break;
    case "flip": flip(); break;
    case "speak": e.stopPropagation(); speakItem(curItem(), view.flipped); break;
    case "rate": (view.name === "conj" ? rateConj : rate)(Number(el.dataset.r)); break;
    case "close": closeDialog(); break;
  }
});
document.addEventListener("keydown", e => {
  const it = curItem();
  if (!it || dlg.open) return;
  if (e.target.matches("input,textarea,select")) return;
  if (view.mode === "type" && !view.flipped){
    if (e.key === " " || e.key === "Enter"){ e.preventDefault(); const a = $("#ans"); a && a.focus(); }
    return;
  }
  if (e.key === "p" || e.key === "P"){ speakItem(it, view.flipped); return; }
  if (!view.flipped && (e.key === " " || e.key === "Enter")){ e.preventDefault(); flip(); }
  else if (view.flipped && ["1","2","3","4"].includes(e.key)){ e.preventDefault(); (view.name === "conj" ? rateConj : rate)(Number(e.key)); }
});

save();
render();
})();
</script>
